name: 上櫃選股系統 每日自動執行
on:
  schedule:
    - cron: '52 09 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝中文字型
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          fc-cache -fv

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝 Python 套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行選股系統
        env:
          FINMIND_TOKEN:    ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER:       ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:   ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          REPORT_URL:       ${{ secrets.REPORT_URL }}
          OTC_CSV_PATH:     otc200.csv
        run: python otc_scanner.py

      - name: 推送輸出檔到倉庫
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output docs

          # ★ 先 pull，避免 non-fast-forward 被拒絕
          git pull --rebase origin main

          # 複製 HTML 到兩個位置
          NEW_HTML=$(ls output/OTC_report_*.html 2>/dev/null | head -1)
          if [ -n "$NEW_HTML" ]; then
            cp "$NEW_HTML" output/index.html
            cp "$NEW_HTML" docs/index.html
            rm -f "$NEW_HTML"
            echo "✅ HTML 已複製到 output/index.html 和 docs/index.html"
          else
            echo "❌ 找不到新的 HTML 檔案！"
            exit 1
          fi

          # 清掉帶日期的舊檔
          git rm -f output/OTC_report_*.html 2>/dev/null || true
          git rm -f output/full_filtered_*.csv 2>/dev/null || true

          # 加入最新 CSV
          LATEST_CSV=$(ls output/full_filtered_*.csv 2>/dev/null | head -1)
          [ -n "$LATEST_CSV" ] && git add -f "$LATEST_CSV"

          # 強制加入 index.html（-f 無視任何忽略規則）
          git add -f output/index.html
          git add -f docs/index.html

          # 顯示 status 方便除錯
          git status

          git diff --cached --quiet || git commit -m "Update: 每日選股報告 $(date +'%Y-%m-%d')"
          git push
