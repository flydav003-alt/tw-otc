name: 上櫃選股系統 每日自動執行

on:
  schedule:
    - cron: '49 06 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安裝中文字型
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          fc-cache -fv

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝 Python 套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行選股系統
        env:
          FINMIND_TOKEN:    ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER:       ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:   ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          REPORT_URL:       ${{ secrets.REPORT_URL }}
          OTC_CSV_PATH:     otc200.csv
        run: python otc_scanner.py

      - name: 推送報告到 docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 確保 docs 資料夾存在
          mkdir -p docs

          # 找到 Python 產生的 HTML，複製到 docs/index.html（GitHub Pages用）
          NEW_HTML=$(ls output/OTC_report_*.html 2>/dev/null | head -1)
          if [ -n "$NEW_HTML" ]; then
            cp "$NEW_HTML" docs/index.html
            echo "✅ 已複製 HTML 到 docs/index.html"
          else
            echo "⚠️ 找不到 HTML 檔案，跳過 GitHub Pages 更新"
          fi

          # 清掉舊 CSV，加入最新 CSV
          git rm -f output/otc_*.csv 2>/dev/null || true
          git rm -f output/full_filtered_*.csv 2>/dev/null || true
          LATEST_CSV=$(ls output/otc_*.csv 2>/dev/null | head -1)
          if [ -n "$LATEST_CSV" ]; then
            git add "$LATEST_CSV"
            echo "✅ 已加入 CSV：$LATEST_CSV"
          else
            echo "❌ 找不到 CSV 檔案，Python 執行可能失敗"
            exit 1
          fi

          # 加入 GitHub Pages HTML
          git add docs/index.html 2>/dev/null || true

          # 顯示狀態
          echo "=== git status ==="
          git status

          # 有變動才 commit
          if git diff --cached --quiet; then
            echo "⚠️  沒有變動，跳過 commit"
          else
            git commit -m "Update: 每日選股報告 $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Push 完成"
          fi

      - name: 推送CSV到stock-database
        env:
          REPO_C_TOKEN: ${{ secrets.REPO_C_TOKEN }}
        run: |
          git clone https://x-access-token:${REPO_C_TOKEN}@github.com/flydav003-alt/stock-database.git repo_c
          mkdir -p repo_c/data
          cp output/otc_*.csv repo_c/data/
          cd repo_c
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "新增 OTC $(date '+%Y%m%d') CSV"
          git push
