name: 上櫃選股系統 每日自動執行

on:
  schedule:
    - cron: '52 07 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安裝中文字型
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          fc-cache -fv

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝 Python 套件
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行選股系統
        env:
          FINMIND_TOKEN:    ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER:       ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:   ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          REPORT_URL:       ${{ secrets.REPORT_URL }}
          OTC_CSV_PATH:     otc200.csv
        run: python otc_scanner.py

      - name: 推送報告到 docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 確保 docs 資料夾存在
          mkdir -p docs

          # 找到 Python 產生的 HTML，直接複製到 docs/index.html
          NEW_HTML=$(ls output/OTC_report_*.html 2>/dev/null | head -1)
          if [ -z "$NEW_HTML" ]; then
            echo "❌ 找不到 HTML 檔案，Python 執行可能失敗"
            exit 1
          fi

          echo "✅ 找到 HTML：$NEW_HTML"
          cp "$NEW_HTML" docs/index.html
          echo "✅ 已複製到 docs/index.html"

          # 也把 CSV 複製到 docs/
          LATEST_CSV=$(ls output/full_filtered_*.csv 2>/dev/null | head -1)
          if [ -n "$LATEST_CSV" ]; then
            cp "$LATEST_CSV" docs/report.csv
            echo "✅ 已複製 CSV 到 docs/report.csv"
          fi

          # 強制加入所有 docs 底下的檔案
          git add -f docs/

          # 顯示狀態
          echo "=== git status ==="
          git status

          echo "=== git diff --cached --stat ==="
          git diff --cached --stat

          # 有變動才 commit
          if git diff --cached --quiet; then
            echo "⚠️  沒有變動，跳過 commit"
          else
            git commit -m "Update: 每日選股報告 $(date +'%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Push 完成"
          fi
